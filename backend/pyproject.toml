[project]
name = "chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "anyio>=4.0",
    "pypdf>=4.0",
    "ddgs>=6.0",
    "trafilatura>=1.12",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
]

[project.scripts]
chatbot = "chatbot.entrypoints.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "psycopg2-binary>=2.9",
    "respx>=0.21",
    "moto[s3]>=5.0",
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
